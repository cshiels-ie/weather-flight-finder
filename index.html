    .gradient-text {

    }
    .card-glow {

      -webkit-appearance: none;

      height: 8px;
      border-radius: 9999px;
      background: linear-gradient(to right, #06b6d4 0%, #8b5cf6 var(--fill, 100%), rgba(255,255,255,0.1) var(--fill, 100%));
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      border: 3px solid #8b5cf6;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      border: 3px solid #8b5cf6;
      cursor: pointer;
    }
  </style>

      { city: "Buenos Aires", country: "Argentina", lat: -34.6037, lon: -58.3816, emoji: "💃" },
    ];

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatKm(km) {
      return km >= 1000 ? (km / 1000).toFixed(1).replace(/\.0$/, "") + "k km" : km + " km";
    }

    function getWeatherIcon(code) {
      if (code === 0) return "☀️";
      if (code <= 3) return "⛅";
      if (code <= 48) return "🌫️";
      if (code <= 67) return "🌧️";
      if (code <= 77) return "❄️";
      if (code <= 82) return "🌧️";
      if (code <= 86) return "🌨️";
      return "⛈️";
    }

    function getTempIcon(temp) {
      if (temp >= 35) return "🔥";
      if (temp >= 25) return "☀️";
      if (temp >= 15) return "🌤️";
      if (temp >= 5) return "☁️";
      return "❄️";
    }

    function App() {
      const [location, setLocation] = useState(null);
      const [currentWeather, setCurrentWeather] = useState(null);
      const [allDestinations, setAllDestinations] = useState([]); // all with weather + distance
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [phase, setPhase] = useState("locating");
      const [locationName, setLocationName] = useState("");
      const [locationSource, setLocationSource] = useState("");
      const [maxDistance, setMaxDistance] = useState(15000); // km
      const [widened, setWidened] = useState(false);

      // Picker state
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [showResults, setShowResults] = useState(false);
      const [searching, setSearching] = useState(false);
      const searchBoxRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (searchBoxRef.current && !searchBoxRef.current.contains(e.target)) {
            setShowResults(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => { detectLocation(); }, []);

      const detectLocation = async () => {
        setLoading(true);
        setError(null);
        setPhase("locating");
        setAllDestinations([]);
        setCurrentWeather(null);

        if (navigator.geolocation) {
          try {
            const position = await new Promise((resolve, reject) => {
              navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
            });
            const { latitude, longitude } = position.coords;
            setLocation({ lat: latitude, lon: longitude });
            setLocationSource("browser");
            await fetchWeather(latitude, longitude);
            return;
          } catch (e) {
            console.log("Browser geolocation failed, trying IP-based...");
          }
        }

        try {
          const response = await fetch('https://ipapi.co/json/');
          if (response.ok) {
            const data = await response.json();
            if (data.latitude && data.longitude) {
              setLocation({ lat: data.latitude, lon: data.longitude });
              setLocationSource("IP");
              setPhase("weather");
              await fetchWeather(data.latitude, data.longitude);
              return;
            }
          }
        } catch (e) {
          console.log("IP geolocation failed");
        }

        const defaultLat = 53.3498, defaultLon = -6.2603;
        setLocation({ lat: defaultLat, lon: defaultLon });
        setLocationSource("default (Dublin)");
        setPhase("weather");
        await fetchWeather(defaultLat, defaultLon);
      };

      // Search cities via Open-Meteo geocoding
      const handleSearch = async () => {
        if (!searchQuery.trim()) return;
        setSearching(true);
        try {
          const response = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchQuery)}&count=8&language=en&format=json`
          );
          const data = await response.json();
          setSearchResults((data.results || []).map(r => ({
            name: r.name,
            country: r.country || "",
            admin1: r.admin1 || "",
            lat: r.latitude,
            lon: r.longitude
          })));
          setShowResults(true);
        } catch (err) {
          setSearchResults([]);
          setShowResults(true);
        }
        setSearching(false);
      };

      const handlePickCity = async (city) => {
        setShowResults(false);
        setSearchQuery(city.name);
        setLoading(true);
        setError(null);
        setAllDestinations([]);
        setCurrentWeather(null);
        setPhase("weather");
        setLocation({ lat: city.lat, lon: city.lon });
        setLocationSource("picked");
        setLocationName(city.admin1 ? `${city.name}, ${city.admin1}, ${city.country}` : `${city.name}, ${city.country}`);
        await fetchWeather(city.lat, city.lon);
      };

      // Fetch current weather + ALL destination weather in ONE batched call
      const fetchWeather = async (lat, lon) => {
        try {
          const latParams = [lat, ...DESTINATIONS.map(d => d.lat)].join(',');
          const lonParams = [lon, ...DESTINATIONS.map(d => d.lon)].join(',');

          const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latParams}&longitude=${lonParams}&current=temperature_2m,weather_code&timezone=auto`
          );
          const data = await response.json();

          // Batched requests return a top-level array (one entry per location);
          // single-location requests return an object with .current
          const results = Array.isArray(data) ? data : [data];

          // First entry = current location
          setCurrentWeather({
            temp: results[0]?.current?.temperature_2m,
            code: results[0]?.current?.weather_code,
            lat,
            lon
          });

          // Rest = destinations, with distance from user
          const dests = DESTINATIONS.map((d, i) => ({
            ...d,
            temp: results[i + 1]?.current?.temperature_2m ?? null,
            code: results[i + 1]?.current?.weather_code ?? 0,
            distance: haversineKm(lat, lon, d.lat, d.lon)
          }));

          setAllDestinations(dests);
          setLoading(false);
          setPhase("done");
        } catch (err) {
          setError("Failed to fetch weather data");
          setLoading(false);
        }
      };

      // Get location name from coordinates (when auto-detected)
      useEffect(() => {
        if (location && locationSource !== "picked") {
          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${location.lat}&lon=${location.lon}&format=json`)
            .then(res => res.json())
            .then(data => {
              const city = data.address.city || data.address.town || data.address.village || data.address.county;
              const country = data.address.country_code?.toUpperCase();
              setLocationName(city ? `${city}, ${country}` : "Your Location");
            })
            .catch(() => setLocationName("Your Location"));
        }
      }, [location]);

      // Filter destinations by max flight distance
      const filtered = useMemo(() => {
        if (!allDestinations.length) return { list: [], widened: false };
        const withTemp = allDestinations.filter(d => d.temp !== null);
        const within = withTemp.filter(d => d.distance <= maxDistance);
        if (within.length >= 3) {
          return { list: within.sort((a, b) => b.temp - a.temp), widened: false };
        }
        // Not enough within range: widen to nearest destinations
        const nearest = [...withTemp].sort((a, b) => a.distance - b.distance).slice(0, 5);
        return { list: nearest.sort((a, b) => b.temp - a.temp), widened: true };
      }, [allDestinations, maxDistance]);

      const hottest = filtered.list[0] || null;
      const coldest = filtered.list[filtered.list.length - 1] || null;
      const displayList = filtered.list.slice(0, 18);
      const sliderFill = ((maxDistance - 500) / (16000 - 500)) * 100;

      const sourceBadge = () => {
        if (locationSource === "browser") return "📍 GPS";
        if (locationSource === "IP") return "🌐 IP-based";
        if (locationSource === "picked") return "✏️ Picked";
        return "📍 Default";
      };

      if (error) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-red-500/20 border border-red-500 rounded-2xl p-8 text-center max-w-md">
              <div className="text-6xl mb-4">😕</div>
              <h2 className="text-2xl font-bold text-white mb-2">Oops!</h2>
              <p className="text-red-300">{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-6xl mx-auto">
            <header className="text-center mb-8">
              <h1 className="text-4xl md:text-6xl font-bold text-white mb-4">
                <span className="gradient-text">Weather Flight Finder</span>
              </h1>
              <p className="text-gray-400 text-lg">
                Find the hottest and coldest destinations within non-stop flight range
              </p>
            </header>

            {/* Location Picker */}
            <div className="max-w-2xl mx-auto mb-10">
              <div ref={searchBoxRef} className="relative">
                <div className="flex gap-3">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      setShowResults(false);
                    }}
                    onKeyDown={(e) => { if (e.key === 'Enter') handleSearch(); }}
                    placeholder="Search for a city, e.g. Paris, New York, Tokyo..."
                    className="flex-1 bg-white/10 border border-white/20 rounded-2xl px-5 py-4 text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/50 transition-all"
                  />
                  <button
                    onClick={handleSearch}
                    disabled={searching}
                    className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold px-6 py-4 rounded-2xl transition-all disabled:opacity-50"
                  >
                    {searching ? "..." : "🔍 Search"}
                  </button>
                </div>

                {showResults && (
                  <div className="absolute z-20 mt-2 w-full bg-slate-800/95 backdrop-blur border border-white/20 rounded-2xl overflow-hidden shadow-2xl">
                    {searchResults.length === 0 && (
                      <p className="text-gray-400 p-4 text-center">No cities found. Try a different search.</p>
                    )}
                    {searchResults.map((city, idx) => (
                      <button
                        key={idx}
                        onClick={() => handlePickCity(city)}
                        className="w-full text-left px-5 py-3 hover:bg-purple-500/20 transition-colors flex items-center justify-between border-b border-white/5 last:border-0"
                      >
                        <div>
                          <p className="text-white font-semibold">📍 {city.name}</p>
                          <p className="text-gray-400 text-sm">
                            {[city.admin1, city.country].filter(Boolean).join(", ")}
                          </p>
                        </div>
                        <span className="text-purple-400 text-sm font-semibold">Select →</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div className="text-center mt-4">
                <button
                  onClick={detectLocation}
                  className="text-purple-300 hover:text-purple-200 text-sm font-semibold underline underline-offset-4 transition-colors"
                >
                  📍 Use my current location instead
                </button>
              </div>
            </div>

            {/* Flight Distance Filter */}
            {!loading && allDestinations.length > 0 && (
              <div className="max-w-3xl mx-auto mb-12">
                <div className="bg-white/5 rounded-3xl p-6 border border-white/10">
                  <div className="flex items-center justify-between mb-2">
                    <p className="text-gray-300 font-semibold flex items-center gap-2">
                      ✈️ Max flight distance
                    </p>
                    <span className="text-2xl font-bold text-purple-300">
                      {formatKm(maxDistance)}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="500"
                    max="16000"
                    step="500"
                    value={maxDistance}
                    onChange={(e) => setMaxDistance(Number(e.target.value))}
                    className="w-full"
                    style={{ '--fill': `${sliderFill}%` }}
                  />
                  <div className="flex justify-between text-xs text-gray-500 mt-2">
                    <span>500 km</span>
                    <span>Short-haul 2,000 km</span>
                    <span>Mid-haul 5,000 km</span>
                    <span>Long-haul 10,000 km</span>
                    <span>Ultra 16,000 km</span>
                  </div>
                  <p className="text-gray-500 text-sm mt-3">
                    {filtered.widened
                      ? `⚠️ Fewer than 3 destinations within ${formatKm(maxDistance)} — showing the nearest ${filtered.list.length} instead.`
                      : `${filtered.list.length} destinations within ${formatKm(maxDistance)} non-stop flight range (of ${allDestinations.length} total).`}
                  </p>
                </div>
              </div>
            )}

            {currentWeather && (
              <div className="mb-12">
                <div className="bg-gradient-to-r from-blue-500/20 to-purple-500/20 rounded-3xl p-8 border border-white/10">
                  <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="text-center md:text-left">
                      <p className="text-gray-400 text-sm uppercase tracking-wider mb-1">
                        Current Location
                        <span className="ml-2 text-xs bg-purple-500/30 text-purple-300 px-2 py-1 rounded-full">
                          {sourceBadge()}
                        </span>
                      </p>
                      <h2 className="text-3xl font-bold text-white mb-1">{locationName}</h2>
                      <p className="text-5xl font-bold text-white">
                        {getTempIcon(currentWeather.temp)} {currentWeather.temp.toFixed(0)}°C
                      </p>
                    </div>
                    <div className="text-center md:text-right">
                      <p className="text-8xl float-animation">{getWeatherIcon(currentWeather.code)}</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {loading && (
              <div className="flex flex-col items-center justify-center py-20">
                <div className="relative">
                  <div className="w-24 h-24 border-4 border-purple-500/30 rounded-full"></div>
                  <div className="absolute top-0 left-0 w-24 h-24 border-4 border-transparent border-t-purple-500 rounded-full animate-spin"></div>
                </div>
                <p className="text-white text-xl mt-6">
                  {phase === "locating" && "Finding your location..."}
                  {phase === "weather" && "Checking your weather..."}
                  {phase === "destinations" && "Scanning flight destinations..."}
                </p>
              </div>
            )}

            {!loading && hottest && coldest && (
              <div className="space-y-8">
                <div className="grid md:grid-cols-2 gap-6">
                  <div className="bg-gradient-to-br from-orange-500/20 to-red-500/20 rounded-3xl p-8 border border-orange-500/30 card-glow pulse-glow">
                    <div className="flex items-center gap-3 mb-4">
                      <span className="text-4xl">🔥</span>
                      <div>
                        <p className="text-orange-400 text-sm uppercase tracking-wider">Hottest Destination</p>
                        <p className="text-3xl font-bold text-white">{hottest.temp.toFixed(0)}°C</p>
                      </div>
                    </div>
                    <h3 className="text-2xl font-bold text-white mb-1">
                      {hottest.emoji} {hottest.city}
                    </h3>
                    <p className="text-gray-400">{hottest.country}</p>
                    <p className="text-purple-300 text-sm mt-1">✈️ {formatKm(hottest.distance)} away</p>
                    <p className="text-5xl mt-4">{getWeatherIcon(hottest.code)}</p>
                  </div>

                  <div className="bg-gradient-to-br from-cyan-500/20 to-blue-500/20 rounded-3xl p-8 border border-cyan-500/30 card-glow pulse-glow">
                    <div className="flex items-center gap-3 mb-4">
                      <span className="text-4xl">❄️</span>
                      <div>
                        <p className="text-cyan-400 text-sm uppercase tracking-wider">Coldest Destination</p>
                        <p className="text-3xl font-bold text-white">{coldest.temp.toFixed(0)}°C</p>
                      </div>
                    </div>
                    <h3 className="text-2xl font-bold text-white mb-1">
                      {coldest.emoji} {coldest.city}
                    </h3>
                    <p className="text-gray-400">{coldest.country}</p>
                    <p className="text-purple-300 text-sm mt-1">✈️ {formatKm(coldest.distance)} away</p>
                    <p className="text-5xl mt-4">{getWeatherIcon(coldest.code)}</p>
                  </div>
                </div>

                <div>
                  <h3 className="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                    <span>🌍</span> Destinations within range
                    <span className="text-sm font-normal text-gray-400">(sorted by temp, showing {displayList.length} of {filtered.list.length})</span>
                  </h3>
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {displayList.map((dest) => (
                      <div
                        key={dest.city}
                        className={`bg-white/5 rounded-2xl p-4 border border-white/10 hover:border-white/20 transition-all hover:scale-105 ${
                          dest.city === hottest.city ? 'ring-2 ring-orange-500' : ''
                        } ${dest.city === coldest.city ? 'ring-2 ring-cyan-500' : ''}`}
                      >
                        <div className="flex items-start justify-between mb-2">
                          <span className="text-3xl">{dest.emoji}</span>
                          <span className="text-2xl">{getWeatherIcon(dest.code)}</span>
                        </div>
                        <h4 className="font-bold text-white text-lg">{dest.city}</h4>
                        <p className="text-gray-400 text-sm mb-1">{dest.country}</p>
                        <p className="text-gray-500 text-xs mb-2">✈️ {formatKm(dest.distance)}</p>
                        <div className="flex items-center gap-2">
                          <span className="text-xl font-bold text-white">{dest.temp.toFixed(0)}°C</span>
                          {dest.city === hottest.city && (
                            <span className="text-xs bg-orange-500/30 text-orange-300 px-2 py-1 rounded-full">HOTTEST</span>
                          )}
                          {dest.city === coldest.city && (
                            <span className="text-xs bg-cyan-500/30 text-cyan-300 px-2 py-1 rounded-full">COLDEST</span>
                          )}
                        </div>
                        <div className="mt-2 h-1 bg-gray-700 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-gradient-to-r from-cyan-500 to-orange-500 transition-all"
                            style={{ width: `${Math.min(100, Math.max(0, ((dest.temp + 10) / 50) * 100))}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white/5 rounded-2xl p-6 border border-white/10">
                  <p className="text-gray-400 text-sm mb-3">Temperature Scale (°C)</p>
                  <div className="h-4 rounded-full bg-gradient-to-r from-cyan-400 via-green-400 via-yellow-400 via-orange-400 to-red-500"></div>
                  <div className="flex justify-between text-xs text-gray-500 mt-2">
                    <span>-10°C</span>
                    <span>10°C</span>
                    <span>30°C</span>
                    <span>50°C</span>
                  </div>
                </div>
              </div>
            )}

            <footer className="mt-16 text-center text-gray-500 text-sm">
              <p>Weather data powered by <span className="text-purple-400">Open-Meteo</span></p>
              <p className="mt-1">Distances are great-circle (haversine) approximations. All temperatures in °C.</p>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
